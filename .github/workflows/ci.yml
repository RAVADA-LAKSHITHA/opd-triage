name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (rules layer, data, model)
        run: python -m pytest -q

      - name: Smoke test full pipeline (generate data, train, report)
        run: |
          python -m src.triage.generate_data --n 3000 --out data/ci.csv
          python -m src.triage.train --data data/ci.csv --out models/ci.joblib